use_default_settings: true

general:
  debug: false
  instance_name: "Aether SearXNG Multi-Engine Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: "aether-local-searxng-secret-2026"
  base_url: http://127.0.0.1:8080/
  image_proxy: false
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-XSS-Protection: 1; mode=block

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  pool_connections: 100
  pool_maxsize: 25
  enable_http2: true

engines:
  # General Engines
  - name: bing
    disabled: false
    weight: 2.0

  - name: duckduckgo
    disabled: false
    weight: 1.5

  - name: google
    disabled: false
    weight: 1.0

  - name: wikipedia
    disabled: false
    weight: 1.2

  - name: wikidata
    disabled: false
    weight: 1.0

  - name: mojeek
    disabled: false
    weight: 1.2

  - name: yahoo
    disabled: false
    weight: 1.0

  - name: brave
    disabled: false
